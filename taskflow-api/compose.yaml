services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://taskflow:${POSTGRES_PASSWORD:-taskflow_dev_only}@db:5432/taskflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS}
      DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskflow_postgres_data:
